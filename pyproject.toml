[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wiki_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "wiki_engine/**/*.py",
    "wiki_engine/templates/*",
    "config/wiki_engine.yaml",
    "README.md",
]

[project]
name = "wiki-code-space"
version = "0.5.3"
description = "Wiki workflow engine that bridges code structure and semantic rationale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
wiki_wspace = "wiki_engine.wiki_wspace:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
