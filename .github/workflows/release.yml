name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify CHANGELOG.md has entry for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain an entry for version ${VERSION}."
            echo "::error::Add a '## [${VERSION}] - YYYY-MM-DD' section before tagging."
            exit 1
          fi
          echo "CHANGELOG.md entry found for version ${VERSION}."

  build:
    needs: changelog-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*  # Uploads .whl and .tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
