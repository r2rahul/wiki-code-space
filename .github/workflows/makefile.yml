name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: make install

    - name: Build
      run: make build

    - name: Run tests
      run: make test
